name: Polyphase MATLAB CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  polyphase_test:
    name: Polyphase Verification
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT POLYPHASE REPOSITORY
      # ============================================================

      - name: Checkout Polyphase Repository
        uses: actions/checkout@v6

      # ============================================================
      # MATLAB ENVIRONMENT
      # ============================================================

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          products: Signal_Processing_Toolbox
          cache: true

      # ============================================================
      # POLYPHASE VERIFICATION
      # ============================================================

      - name: Run Polyphase Tests
        uses: matlab-actions/run-command@v3
        with:
          command: DSPRunTests

      # ============================================================
      # TEST EVIDENCE
      # ============================================================

      - name: Upload Polyphase Test Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: polyphase-test-reports
          path: test-results/
          if-no-files-found: warn
          retention-days: 30

  # ============================================================
  # POLYPHASE TO SYSTEM INTEGRATION TRIGGER
  # ============================================================

  trigger_integration:
    name: Trigger System Integration
    needs: polyphase_test

    if: >
      needs.polyphase_test.result == 'success' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:

      - name: Trigger System Integration CI
        env:
          DISPATCH_TOKEN: ${{ secrets.INTEGRATION_DISPATCH_TOKEN }}

        run: |
          curl --fail-with-body \
            -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            https://api.github.com/repos/DamiProject/System-Integration-ADC-Polyphase-Decimation-Filter/dispatches \
            -d '{
              "event_type": "polyphase-updated",
              "client_payload": {
                "source_repository": "${{ github.repository }}",
                "source_sha": "${{ github.sha }}"
              }
            }'
